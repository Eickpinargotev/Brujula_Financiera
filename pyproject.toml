[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brujula"
version = "0.1.0"
description = "Copiloto financiero personal por Telegram + dashboard privado"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  # Web / dashboard
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2",
  # Bot
  "python-telegram-bot>=21.6",
  # Agente IA
  "langgraph>=0.2.45",
  "langchain-openai>=0.2",
  "openai>=1.54",
  # Transcripción
  "elevenlabs>=1.10",
  # Datos
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  # Config / utilidades
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dateutil>=2.9",
  "httpx>=0.27",
  "passlib[bcrypt]>=1.7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
